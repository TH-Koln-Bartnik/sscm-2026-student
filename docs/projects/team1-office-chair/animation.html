const keys = Object.keys(D.scenarios);

function box(x,y,w,h,fill,stroke){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" fill="${fill}" stroke="${stroke||'none'}" stroke-width="1.5"/>`}
function txt(x,y,s,sz,col,anchor,wt){return `<text x="${x}" y="${y}" font-size="${sz}" fill="${col||'#333'}" text-anchor="${anchor||'middle'}" font-weight="${wt||400}">${s}</text>`}
function drawStage(){
  const S = D.scenarios[sc], W = S.weeks, i = wk;
  const down = W.supplier_down[i], stopped = W.stopped_hours[i] > 0;
  let s = '';
  // supplier
  const supName = (W.supplier && W.supplier[i]) || D.supplier;
  s += box(8,50,120,70,'#f4f4f4',down?'#d62839':'#888');
  s += txt(68,70,'Supplier',12,'#222','middle',700) + txt(68,86,supName,9,'#444') +
       txt(68,106,down ? 'Suez closed' : 'delivering',10,down?'#d62839':'#2e8b57','middle',700);
  // transit
  const nTr = Math.min(7, Math.ceil(W.in_transit[i] / (D.parts_per_square || 700)));
  s += txt(172,60,'in transit: ' + W.in_transit[i],10,'#444');
  s += `<line x1="132" y1="85" x2="212" y2="85" stroke="${down?'#d62839':'#999'}" stroke-width="2" stroke-dasharray="6 4"/>`;
  for (let k=0;k<nTr;k++) s += box(134 + k*11, 79, 9, 12, down ? '#d62839' : '#555');
  // stock bucket
  const bh = 110, fill = Math.round(bh * W.stock[i] / maxStock);
  s += `<rect x="230" y="30" width="56" height="${bh}" fill="#fff" stroke="#555" stroke-width="1.5"/>`;
  s += `<rect x="231.5" y="${30+bh-fill}" width="53" height="${fill}" fill="${W.stock[i]===0?'#d62839':'#5b8fd0'}"/>`;
  s += txt(258,24,'Stock',11,'#222','middle',700) + txt(258,156,W.stock[i] + ' parts',10,'#444');
  // stations
  const x0 = 312, dx = 78;
  s += `<line x1="${x0-10}" y1="85" x2="${x0+4*dx+80}" y2="85" stroke="#ddd" stroke-width="5"/>`;
  D.stations.forEach((name,j) => {
    const x = x0 + j*dx, q = W.queue[i][j], isKey = j === D.key_station_index;
    const red = isKey && stopped;
    s += txt(x+34,50,Math.round(q) + ' waiting',9,'#a05a00');
    const nd = Math.min(10, Math.round(q/5));
    for (let d=0; d<nd; d++) s += `<circle cx="${x+10+d*6}" cy="60" r="2.6" fill="#d62839"/>`;
    s += box(x,70,68,30,red?'#d62839':'#999') + txt(x+34,89,'S'+(j+1),10,'#fff','middle',700);
    const words = name.split(' ').slice(0,3).join(' ');
    s += txt(x+34,116,words.length>16 ? words.slice(0,16)+'…' : words,8.5,'#444');
  });
  // finished
  const fx = x0 + 5*dx + 4;
  s += txt(fx,60,'Finished',10,'#222','start',700) + txt(fx,84,W.finished[i] ,22,'#222','start',700) +
       txt(fx,98,'this week',9,'#555','start');
  const cum = W.finished.slice(0,i+1).reduce((a,b)=>a+b,0);
  s += txt(fx,112,Math.round(cum).toLocaleString('en-US') + ' so far',9,'#777','start');
  $('stage').innerHTML = s;
  $('note').textContent = 'Scenario: ' + S.label + (stopped ? ' — line waits for parts (' + W.stopped_hours[i].toFixed(1) + ' h this week)' : '');
}
function drawKpi(){
  const S = D.scenarios[sc], b = S.scoreboard, lo = S.scoreboard_min, hi = S.scoreboard_max;
  const f = (v,d) => v.toFixed(d);
  const rng = (k,d) => lo ? 'range ' + f(lo[k],d) + ' – ' + f(hi[k],d) : '';
  const T = [[f(b.units_per_week,1), unit + ' per week', rng('units_per_week',1)],
             [f(b.cost_per_unit_eur,2) + ' €', 'total cost per unit (one year)', rng('cost_per_unit_eur',2)],
             [f(b.kg_co2e_per_unit,2), 'kg CO₂e per unit', rng('kg_co2e_per_unit',2)],
             [f(b.hours_stopped,1) + ' h', 'line stood still (year)', rng('hours_stopped',1)]];
  $('kpi').innerHTML = T.map(t => `<div style="background:#f1f1f1;border-radius:6px;padding:8px 10px"><div style="font-size:20px;font-weight:700">${t[0]}</div><div style="font-size:11px;color:#444">${t[1]}</div><div style="font-size:10px;color:#888">${t[2]}</div></div>`).join('');
}
function drawChart(){
  const X0=46,X1=740,Y0=14,Y1=120; let s='';
  const x = w => X0 + (X1-X0)*w/(N-1), y = v => Y1 - (Y1-Y0)*v/maxFin;
  s += txt(X0,9,unit + ' finished per week',9,'#555','start');
  [0,0.5,1].forEach(g => { const v = maxFin*g; s += `<line x1="${X0}" y1="${y(v)}" x2="${X1}" y2="${y(v)}" stroke="#eee"/>` + txt(X0-4,y(v)+3,Math.round(v),8,'#777','end'); });
  keys.forEach(k => {
    const d = D.scenarios[k].weeks.finished.map((v,w) => (w?'L':'M') + x(w).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
    s += `<path d="${d}" fill="none" stroke="${COL[k]||'#888'}" stroke-width="${k===sc?2.4:1.2}" opacity="${k===sc?1:0.55}"/>`;
  });
  s += `<line x1="${x(wk)}" y1="${Y0}" x2="${x(wk)}" y2="${Y1}" stroke="#555" stroke-dasharray="3 3"/>`;
  keys.forEach((k,j) => { const lx = X0 + j*230; s += `<rect x="${lx}" y="140" width="12" height="4" fill="${COL[k]||'#888'}"/>` + txt(lx+16,146,D.scenarios[k].label,9,'#444','start'); });
  s += txt(X0,160,'week 1',8,'#777','start') + txt(X1,160,'week ' + N,8,'#777','end');
  $('chart').innerHTML = s;
}
function draw(){
  $('wk').textContent = 'Week ' + (wk+1); $('sl').value = wk;
  [...$('btns').children].forEach(b => { const on = b.dataset.k === sc; b.style.background = on ? '#111' : '#fff'; b.style.color = on ? '#fff' : '#222'; });
  drawStage(); drawKpi(); drawChart();
}
function stop(){ clearInterval(timer); timer = null; $('play').innerHTML = '&#9654; Play'; }
function start(){ if (wk >= N-1) wk = 0; $('play').innerHTML = '&#10074;&#10074; Pause';
  timer = setInterval(() => { if (wk < N-1) { wk++; draw(); } else stop(); }, +$('spd').value); }
$('play').onclick = () => timer ? stop() : start();
$('sl').oninput = e => { wk = +e.target.value; draw(); };
$('spd').onchange = () => { if (timer) { stop(); start(); } };
draw();
})();
