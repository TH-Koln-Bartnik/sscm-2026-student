<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="A firm transforms inputs into outputs, driven by profit. Its external effects fall on the environment, on people and on other firms. This module's definition of sustainable puts the flashlight on the environmental effects.">
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker>
    <marker id="sg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b73"/></marker>
  </defs>
  <rect width="960" height="340" fill="#ffffff"/>
  <!-- flashlight beam -->
  <path d="M520,150 L900,40 L900,250 Z" fill="#ea5a00" opacity="0.12"/>
  <!-- flashlight body -->
  <g transform="translate(455,125)">
    <rect x="0" y="12" width="56" height="26" fill="#111111"/>
    <path d="M56,6 L72,0 L72,50 L56,44 Z" fill="#111111"/>
    <rect x="72" y="0" width="6" height="50" fill="#ea5a00"/>
  </g>
  <text x="470" y="200" font-size="12" fill="#ea5a00" font-weight="700">our definition:</text>
  <text x="470" y="216" font-size="12" fill="#ea5a00" font-weight="700">the flashlight on the</text>
  <text x="470" y="232" font-size="12" fill="#ea5a00" font-weight="700">environmental effects</text>
  <!-- the firm -->
  <g font-size="14" text-anchor="middle" fill="#111111">
    <rect x="150" y="90" width="260" height="150" fill="#ffffff" stroke="#c81e0f" stroke-width="4"/>
    <text x="280" y="120" font-weight="700" fill="#c81e0f">The firm</text>
    <text x="280" y="142" font-size="12">inputs → transformation → outputs</text>
    <rect x="195" y="160" width="170" height="52" fill="#f5f5f7" stroke="#111111" stroke-width="1"/>
    <text x="280" y="182" font-weight="700" font-size="13">Profit</text>
    <text x="280" y="200" font-size="11" fill="#6b6b73">the driver that motivates the business</text>
  </g>
  <g stroke="#111111" stroke-width="3" fill="none" marker-end="url(#s)">
    <path d="M40,165 L146,165"/>
  </g>
  <text x="90" y="150" font-size="12" fill="#111111" text-anchor="middle">inputs</text>
  <g stroke="#111111" stroke-width="3" fill="none" marker-end="url(#s)">
    <path d="M410,112 L500,112"/>
  </g>
  <text x="455" y="100" font-size="12" fill="#111111" text-anchor="middle">outputs, revenue</text>
  <!-- external effects: three arrows -->
  <g stroke="#6b6b73" stroke-width="2" fill="none" marker-end="url(#sg)">
    <path d="M280,240 L280,290"/>
    <path d="M200,240 L120,290"/>
    <path d="M360,240 L440,290"/>
  </g>
  <g font-size="12" fill="#111111" text-anchor="middle">
    <text x="100" y="310">on other firms</text>
    <text x="100" y="326" fill="#6b6b73" font-size="11">suppliers, competitors</text>
    <text x="280" y="310">on people</text>
    <text x="280" y="326" fill="#6b6b73" font-size="11">workers, neighbours, customers</text>
    <text x="460" y="310">on the environment</text>
    <text x="460" y="326" fill="#6b6b73" font-size="11">CO₂, energy, materials, water, waste</text>
  </g>
  <text x="280" y="262" font-size="11" fill="#6b6b73" text-anchor="middle">external effects — what the firm causes but does not pay for</text>
  <!-- in the beam: what we measure -->
  <g font-size="13" fill="#111111">
    <text x="600" y="90" font-weight="700" fill="#ea5a00">What we measure, week by week</text>
    <text x="600" y="116">kg CO₂e per product, measured beside € per product</text>
    <text x="600" y="140">kWh per product, and where the electricity goes</text>
    <text x="600" y="164">the materials in a product and their footprint</text>
    <text x="600" y="188">scrap: what a defect wastes in kg and kWh</text>
    <text x="600" y="212">what a sourcing plan and a year's plan do to the footprint</text>
    <text x="600" y="248" font-size="11" fill="#6b6b73">People and other firms are not less important — they are</text>
    <text x="600" y="264" font-size="11" fill="#6b6b73">outside this beam so that seven weeks can go deep on one thing.</text>
  </g>
</svg>
