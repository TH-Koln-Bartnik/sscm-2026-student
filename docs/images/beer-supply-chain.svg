<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="A beer supply chain: barley farm, maltster, brewery, distributor, retailer, consumer. Materials flow forward, orders and information flow backward.">
  <defs>
    <marker id="fwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c81e0f"/></marker>
    <marker id="back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#b43092"/></marker>
  </defs>
  <rect width="960" height="300" fill="#ffffff"/>
  <!-- stages -->
  <g font-size="14" fill="#111111" text-anchor="middle">
    <g>
      <rect x="20" y="95" width="130" height="80" fill="#f5f5f7" stroke="#111111" stroke-width="1.5"/>
      <text x="85" y="128" font-weight="700">Barley farm</text>
      <text x="85" y="150" font-size="12" fill="#6b6b73">grows grain</text>
    </g>
    <g>
      <rect x="190" y="95" width="130" height="80" fill="#f5f5f7" stroke="#111111" stroke-width="1.5"/>
      <text x="255" y="128" font-weight="700">Maltster</text>
      <text x="255" y="150" font-size="12" fill="#6b6b73">turns grain into malt</text>
    </g>
    <g>
      <rect x="360" y="85" width="150" height="100" fill="#ffffff" stroke="#c81e0f" stroke-width="3"/>
      <text x="435" y="118" font-weight="700">Brewery</text>
      <text x="435" y="140" font-size="12" fill="#6b6b73">malt, hops, water,</text>
      <text x="435" y="156" font-size="12" fill="#6b6b73">energy → beer</text>
    </g>
    <g>
      <rect x="550" y="95" width="130" height="80" fill="#f5f5f7" stroke="#111111" stroke-width="1.5"/>
      <text x="615" y="128" font-weight="700">Distributor</text>
      <text x="615" y="150" font-size="12" fill="#6b6b73">warehouse, trucks</text>
    </g>
    <g>
      <rect x="720" y="95" width="120" height="80" fill="#f5f5f7" stroke="#111111" stroke-width="1.5"/>
      <text x="780" y="128" font-weight="700">Retailer</text>
      <text x="780" y="150" font-size="12" fill="#6b6b73">shelf, cold room</text>
    </g>
    <g>
      <circle cx="905" cy="135" r="36" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
      <text x="905" y="140" font-weight="700" font-size="13">You</text>
    </g>
  </g>
  <!-- forward material flow -->
  <g stroke="#c81e0f" stroke-width="3" fill="none" marker-end="url(#fwd)">
    <path d="M150,120 L188,120"/><path d="M320,120 L358,120"/><path d="M510,120 L548,120"/><path d="M680,120 L718,120"/><path d="M840,120 L867,120"/>
  </g>
  <!-- backward information flow -->
  <g stroke="#b43092" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-start="url(#back)">
    <path d="M152,160 L188,160"/><path d="M322,160 L358,160"/><path d="M512,160 L548,160"/><path d="M682,160 L718,160"/><path d="M842,160 L868,160"/>
  </g>
  <!-- legend -->
  <g font-size="13" fill="#111111">
    <line x1="30" y1="230" x2="80" y2="230" stroke="#c81e0f" stroke-width="3" marker-end="url(#fwd)"/>
    <text x="90" y="235">materials and products move forward: grain, malt, beer, crates</text>
    <line x1="30" y1="262" x2="80" y2="262" stroke="#b43092" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#back)"/>
    <text x="90" y="267">orders and information move backward: what the shelf sold, what the brewery needs next week</text>
  </g>
  <text x="435" y="60" font-size="13" fill="#c81e0f" text-anchor="middle" font-weight="700">the transformation inside one firm — where this module spends most of its time</text>
  <text x="480" y="292" font-size="11" fill="#6b6b73" text-anchor="middle">Every box has its own inputs, outputs and people; the chain is only as reliable as its weakest link — and the beer game (Sterman, 1989) shows what the backward arrows do to it.</text>
</svg>
