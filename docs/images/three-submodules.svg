<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Managing a business: inputs are transformed into outputs. Controlling provides the data; logistics moves inputs and outputs; this module covers the transformation inside and between firms.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea5a00"/></marker>
  </defs>
  <rect width="960" height="330" fill="#ffffff"/>
  <!-- controlling band -->
  <rect x="120" y="20" width="720" height="58" fill="#f5f5f7" stroke="#b43092" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="480" y="44" font-size="15" font-weight="700" fill="#b43092" text-anchor="middle">Controlling — gives us the data</text>
  <text x="480" y="64" font-size="12" fill="#6b6b73" text-anchor="middle">measures inputs, outputs and money: costs, productivity, margins — the numbers every decision below is made on</text>
  <!-- data arrows down -->
  <g stroke="#b43092" stroke-width="2" stroke-dasharray="6 4" fill="none">
    <path d="M200,78 L200,118"/><path d="M480,78 L480,118"/><path d="M760,78 L760,118"/>
  </g>
  <!-- inputs -->
  <g font-size="14" fill="#111111" text-anchor="middle">
    <rect x="110" y="120" width="180" height="120" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
    <text x="200" y="150" font-weight="700">Inputs</text>
    <text x="200" y="175" font-size="12" fill="#6b6b73">materials · parts · labor</text>
    <text x="200" y="193" font-size="12" fill="#6b6b73">energy · machines · money</text>
    <text x="200" y="211" font-size="12" fill="#6b6b73">information</text>
  </g>
  <!-- transformation -->
  <g font-size="14" fill="#111111" text-anchor="middle">
    <rect x="360" y="105" width="240" height="150" fill="#ffffff" stroke="#c81e0f" stroke-width="4"/>
    <text x="480" y="138" font-weight="700" fill="#c81e0f">Transformation</text>
    <text x="480" y="160" font-size="12">stations, lines, suppliers, plans</text>
    <text x="480" y="182" font-size="12" fill="#6b6b73">inside the firm and between firms</text>
    <text x="480" y="215" font-size="13" font-weight="700">this module</text>
    <text x="480" y="234" font-size="12" fill="#6b6b73">Sustainable Supply Chain Management</text>
  </g>
  <!-- outputs -->
  <g font-size="14" fill="#111111" text-anchor="middle">
    <rect x="670" y="120" width="180" height="120" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
    <text x="760" y="150" font-weight="700">Outputs</text>
    <text x="760" y="175" font-size="12" fill="#6b6b73">bikes · beer · services</text>
    <text x="760" y="193" font-size="12" fill="#6b6b73">profit — and effects on</text>
    <text x="760" y="211" font-size="12" fill="#6b6b73">people and the environment</text>
  </g>
  <!-- logistics arrows -->
  <g stroke="#ea5a00" stroke-width="4" fill="none" marker-end="url(#ao)">
    <path d="M292,180 L356,180"/><path d="M602,180 L666,180"/>
    <path d="M30,180 L106,180"/><path d="M852,180 L930,180"/>
  </g>
  <text x="324" y="170" font-size="11" fill="#ea5a00" text-anchor="middle" font-weight="700">logistics</text>
  <text x="634" y="170" font-size="11" fill="#ea5a00" text-anchor="middle" font-weight="700">logistics</text>
  <text x="68" y="170" font-size="11" fill="#ea5a00" text-anchor="middle">from suppliers</text>
  <text x="891" y="170" font-size="11" fill="#ea5a00" text-anchor="middle">to customers</text>
  <!-- logistics band -->
  <rect x="120" y="270" width="720" height="44" fill="#ffffff" stroke="#ea5a00" stroke-width="2"/>
  <text x="480" y="289" font-size="15" font-weight="700" fill="#ea5a00" text-anchor="middle">Logistics — moves inputs and outputs</text>
  <text x="480" y="306" font-size="12" fill="#6b6b73" text-anchor="middle">transport, warehouses, inventory: the Tuesday sub-module</text>
</svg>
